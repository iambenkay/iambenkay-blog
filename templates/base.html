<!doctype html>
<html lang="en" class="">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        {% block head %}{% endblock head %}
        <link href="/markdown.css" rel="stylesheet" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
            };
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Lora:ital,wght@0,600;1,400&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Inter", sans-serif;
            }
            .font-serif {
                font-family: "Lora", serif;
            }
        </style>
    </head>
    <body
        class="bg-stone-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-200"
    >
        <!-- Nav -->
        <header
            class="border-b border-zinc-200 dark:border-zinc-800 bg-stone-50/80 dark:bg-zinc-950/80 backdrop-blur-sm sticky top-0 z-10"
        >
            <div
                class="max-w-3xl mx-auto px-6 h-14 flex items-center justify-between"
            >
                <a href="/" class="flex items-center gap-2.5 group min-w-0">
                    <div
                        class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold text-sm shrink-0"
                    >
                        B
                    </div>
                    <span
                        class="font-semibold text-sm text-zinc-800 dark:text-zinc-200 group-hover:text-rose-500 dark:group-hover:text-rose-400 transition-colors truncate"
                        >Benjamin Chibuzor-Orie</span
                    >
                </a>
                <button
                    id="theme-toggle"
                    aria-label="Toggle dark mode"
                    class="p-2 rounded-lg text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors"
                >
                    <!-- Sun icon (shown in dark mode) -->
                    <svg
                        id="icon-sun"
                        xmlns="http://www.w3.org/2000/svg"
                        class="hidden w-5 h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 7a5 5 0 100 10A5 5 0 0012 7z"
                        />
                    </svg>
                    <!-- Moon icon (shown in light mode) -->
                    <svg
                        id="icon-moon"
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-5 h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"
                        />
                    </svg>
                </button>
            </div>
        </header>

        <main class="max-w-3xl mx-auto px-6 py-10">
            {% block content %}{% endblock content %}
        </main>

        <!-- Footer -->
        <footer class="border-t border-zinc-200 dark:border-zinc-800 mt-16">
            <div
                class="max-w-3xl mx-auto px-6 py-8 flex flex-col sm:flex-row items-center justify-end gap-2 text-sm text-zinc-500 dark:text-zinc-500"
            >
                <span>© 2026 Benjamin Chibuzor-Orie</span>
            </div>
        </footer>

        <script>
            // Dark mode toggle
            const html = document.documentElement;
            const toggle = document.getElementById("theme-toggle");
            const sun = document.getElementById("icon-sun");
            const moon = document.getElementById("icon-moon");

            function applyTheme(dark) {
                html.classList.toggle("dark", dark);
                sun.classList.toggle("hidden", !dark);
                moon.classList.toggle("hidden", dark);
            }

            const stored = localStorage.getItem("theme");
            const prefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)",
            ).matches;
            applyTheme(stored === "dark" || (!stored && prefersDark));

            toggle.addEventListener("click", () => {
                const isDark = html.classList.contains("dark");
                applyTheme(!isDark);
                localStorage.setItem("theme", isDark ? "light" : "dark");
            });
        </script>

        <script type="module">
            import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.15.0/+esm";
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
            import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";

            const firebaseConfig = {
                apiKey: "AIzaSyDbmff0_NioNCGzbRl_E_ldtXbxQIcpcJs",
                authDomain: "benkay-blog.firebaseapp.com",
                projectId: "benkay-blog",
                storageBucket: "benkay-blog.firebasestorage.app",
                messagingSenderId: "880946931838",
                appId: "1:880946931838:web:9a0899015b0ca6eadd902f",
                measurementId: "G-LPDNWEQSQK",
            };

            if (window.location.hostname !== "localhost") {
                const app = initializeApp(firebaseConfig);
                const analytics = getAnalytics(app);
            }
            mermaid.initialize({ startOnLoad: true });
        </script>
    </body>
</html>
